name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore .\CaseMesh.slnx
      - name: Build
        run: dotnet build .\CaseMesh.slnx -c Release --no-restore
      - name: Test
        run: dotnet test .\CaseMesh.slnx -c Release --no-build --logger "trx;LogFileName=test-results.trx"
